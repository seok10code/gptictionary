{% extends "base.html" %}

{% block content %}

<h1 class="page-title">설정</h1>
<p class="page-desc">필요한 AI 기능만 간단하게 설정합니다.</p>

{% if message %}
<div class="card" style="margin-bottom: 20px;">
    <p>{{ message }}</p>
</div>
{% endif %}

<form method="post" action="/settings" class="settings-form">

    <div class="card setting-section">
        <h2>GPT 답변 스타일</h2>

        <label class="setting-label">답변 길이</label>
        <select name="gpt_answer_style" class="input">
            <option value="short" {% if settings.gpt_answer_style == "short" %}selected{% endif %}>
                짧게
            </option>
            <option value="normal" {% if settings.gpt_answer_style == "normal" %}selected{% endif %}>
                보통
            </option>
            <option value="detail" {% if settings.gpt_answer_style == "detail" %}selected{% endif %}>
                자세히
            </option>
        </select>
    </div>

    <div class="card setting-section">
        <h2>AI 기능</h2>

        <label class="checkbox-row">
            <input
                type="checkbox"
                name="qdrant_enabled"
                {% if settings.qdrant_enabled %}checked{% endif %}
            >
            유사 질문 검색 사용
        </label>

        <label class="checkbox-row">
            <input
                type="checkbox"
                name="auto_example_enabled"
                {% if settings.auto_example_enabled %}checked{% endif %}
            >
            자동 예문 생성 사용
        </label>
    </div>

    <button type="submit" class="btn">설정 저장</button>

</form>

{% endblock %}
